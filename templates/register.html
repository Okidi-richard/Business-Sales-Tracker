{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create Account</h1>
    <p>Start managing your business sales digitally.</p>

    <form method="post">

        <label>Owner's name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter owner's name"
            required
        >

        <label>Business name</label>
        <input
            type="text"
            name="business_name"
            placeholder="Enter business name"
            required
        >

        <label>Phone number</label>
        <input
            type="text"
            name="phone"
            placeholder="07XXXXXXXX"
            required
        >

        <label>Email <span>(optional)</span></label>
        <input
            type="email"
            name="email"
            placeholder="example@email.com"
        >

        <label>Business address <span>(optional)</span></label>
        <input
            type="text"
            name="address"
            placeholder="Business location / address"
        >

        <label>Business tagline <span>(optional)</span></label>
        <input
            type="text"
            name="tagline"
            placeholder="e.g. Quality products, trusted service"
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            minlength="6"
            placeholder="At least 6 characters"
            required
        >

        <button type="submit">Create Account</button>

    </form>

    <p class="center">
        Already registered?
        <a href="{{ url_for('login') }}">Login</a>
    </p>
</div>
{% endblock %}
