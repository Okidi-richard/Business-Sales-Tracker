{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p>Sign in to your business account.</p>
  <form method="post">
    <label>Phone number or email</label>
    <input name="identifier" required placeholder="e.g. 0770000000">
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Login</button>
  </form>
  <p class="center">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
</div>
{% endblock %}
