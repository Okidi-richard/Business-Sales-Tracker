{% extends "base.html" %}{% block title %}Expenses{% endblock %}{% block content %}<h1>Expenses</h1><div class="page-card"><form method="post"><div class="form-grid"><div><label>Description</label><input name="description" required></div><div><label>Amount</label><input name="amount" type="number" step="0.01" min="0.01" required></div></div><button>Record Expense</button></form></div><div class="table-wrap"><table><tr><th>Date</th><th>Description</th><th>Amount</th></tr>{% for e in expenses %}<tr><td>{{ e.created_at.strftime('%d %b %Y %H:%M') }}</td><td>{{ e.description }}</td><td>UGX {{ '{:,.0f}'.format(e.amount) }}</td></tr>{% else %}<tr><td colspan="3">No expenses yet.</td></tr>{% endfor %}</table></div>{% endblock %}
