{% extends "base.html" %}{% block title %}Customers{% endblock %}{% block content %}<h1>Customers</h1><div class="page-card"><form method="post"><div class="form-grid"><div><label>Customer name</label><input name="name" required></div><div><label>Phone</label><input name="phone"></div></div><button>Add Customer</button></form></div><div class="table-wrap"><table><tr><th>Name</th><th>Phone</th><th>Amount owing</th></tr>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.phone or '-' }}</td><td>UGX {{ '{:,.0f}'.format(balances[c.id]) }}</td></tr>{% else %}<tr><td colspan="3">No customers yet.</td></tr>{% endfor %}</table></div>{% endblock %}
